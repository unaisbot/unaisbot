

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10251d">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>
          <strong>unais.bot</strong>
          <small>The Alien Ecology</small>
        </span>
      </a>

      <button class="menu-toggle" aria-expanded="false" aria-controls="site-nav">
        Menu ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/topics/' | relative_url }}">Topics</a>
        <a href="{{ '/resources/' | relative_url }}">Resources</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="brand footer-brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark" aria-hidden="true">✳</span>
        <span>
          <strong>unais.bot</strong>
          <small>The Alien Ecology</small>
        </span>
      </a>
      <p>Exploring biodiversity, ecology and the natural world.</p>
      <div class="footer-links">
        <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS feed</a>
      </div>
      <small>© {{ 'now' | date: '%Y' }} unais.bot</small>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
